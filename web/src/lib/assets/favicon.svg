  width="32"
  height="32"
  viewBox="0 0 32 32"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">twitch_relay favicon 32x32</title>
  <desc id="desc">Traced TR relay favicon scaled up to better fill the canvas.</desc>

  <defs>
    <linearGradient id="bg" x1="4.25" y1="2.25" x2="27.75" y2="29.75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11131d" />
      <stop offset="0.55" stop-color="#080910" />
      <stop offset="1" stop-color="#050509" />
    </linearGradient>

    <linearGradient id="purple" x1="6.5" y1="4.875" x2="24.875" y2="26.375" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b35ff" />
      <stop offset="0.5" stop-color="#8a20ff" />
      <stop offset="1" stop-color="#7a22f0" />
    </linearGradient>

    <linearGradient id="pink" x1="15.5" y1="13" x2="19.25" y2="17.75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff1f72" />
      <stop offset="1" stop-color="#ff2f5f" />
    </linearGradient>

    <clipPath id="rounded-icon">
      <rect width="32" height="32" rx="6.25" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded-icon)">
