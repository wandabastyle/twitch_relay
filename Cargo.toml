[package]
name = "twitch-relay"
version = "0.6.2"
edition = "2024"
description = "A relay service for Twitch streams"
license = "MIT"
repository = "https://github.com/wandabastyle/twitch-relay"
keywords = ["twitch", "streaming", "relay"]
categories = ["multimedia", "web"]
readme = "README.md"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
axum = "0.8.6"
base64 = "0.22.1"
futures-util = "0.3.31"
rand = "0.9"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "process", "net"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6.6", features = ["fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
directories = "6"
dotenvy = "0.15.7"
toml = "0.8"
urlencoding = "2.1"
regex = "1"
quick-xml = "0.38"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
uuid = { version = "1.10.0", features = ["v4"] }

[profile.release]
lto = false
codegen-units = 16
panic = "abort"
strip = "symbols"

[lints.clippy]
all      = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# This lint is disabled because transitive dependencies frequently require multiple versions
# of the same crate, which is an ecosystem-wide issue that cannot be resolved by this application.
multiple_crate_versions = { level = "allow", priority = 1 }
